---
- name: TLS certificate authority
  hosts: all
  roles:
    - tls_ca

- name: Reset connections before proceeding (guards against SSM sessions going idle during the local-only TLS play)
  hosts: all
  gather_facts: false
  tasks:
    - meta: reset_connection

- name: OS baseline & hardening
  hosts: all
  become: true
  roles:
    - common

- name: PostgreSQL — storage and installation
  hosts: postgres
  become: true
  roles:
    - postgresql

- name: etcd — distributed consensus store
  hosts: etcd
  become: true
  roles:
    - etcd