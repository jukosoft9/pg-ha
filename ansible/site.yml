---
- name: TLS certificate authority
  hosts: all
  roles:
    - tls_ca

- name: Reset connections before proceeding (guards against SSM sessions going idle during the local-only TLS play)
  hosts: all
  gather_facts: false
  tasks:
    - meta: reset_connection

- name: OS baseline & hardening
  hosts: all
  become: true
  roles:
    - common

- name: etcd — distributed consensus store
  hosts: etcd
  become: true
  roles:
    - etcd

- name: Patroni — HA orchestration
  hosts: postgres
  become: true
  roles:
    - patroni

- name: PgBouncer — connection pooling
  hosts: postgres
  become: true
  roles:
    - pgbouncer

- name: pgBackRest — physical backups
  hosts: postgres
  become: true
  roles:
    - pgbackrest

- name: HAProxy — connection routing
  hosts: loadbalancers
  become: true
  roles:
    - haproxy

- name: node_exporter — OS-level metrics on every node
  hosts: all
  become: true
  roles:
    - node_exporter

- name: postgres_exporter — PostgreSQL metrics
  hosts: postgres
  become: true
  roles:
    - postgres_exporter

- name: pgbouncer_exporter — PgBouncer pooling metrics
  hosts: postgres
  become: true
  roles:
    - pgbouncer_exporter

- name: Prometheus — metrics collection
  hosts: mon1
  become: true
  roles:
    - prometheus

- name: Alertmanager — alert routing
  hosts: mon1
  become: true
  roles:
    - alertmanager

- name: Grafana — dashboards
  hosts: mon1
  become: true
  roles:
    - grafana