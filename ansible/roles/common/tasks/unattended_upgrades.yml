---
- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present

- name: Restrict unattended-upgrades to security updates only
  copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-security-only
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"

- name: Enable the periodic apt timer that actually triggers unattended-upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Ensure the apt timers that run unattended-upgrades are enabled
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer