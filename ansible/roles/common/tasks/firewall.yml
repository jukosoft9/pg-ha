---
- name: Install ufw
  apt:
    name: ufw
    state: present

- name: Allow SSH before enabling ufw — ordering matters here
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Set default deny incoming
  ufw:
    direction: incoming
    policy: deny

- name: Set default allow outgoing
  ufw:
    direction: outgoing
    policy: allow

- name: Enable ufw
  ufw:
    state: enabled