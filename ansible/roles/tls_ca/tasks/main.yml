---
- name: Create local TLS working directory (control machine only — never synced to any node)
  ansible.builtin.file:
    path: "{{ playbook_dir }}/tls_ca"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: Generate CA private key (control machine only)
  ansible.builtin.command: openssl genrsa -out {{ playbook_dir }}/tls_ca/ca.key 4096
  args:
    creates: "{{ playbook_dir }}/tls_ca/ca.key"
  delegate_to: localhost
  run_once: true

- name: Generate self-signed CA certificate
  ansible.builtin.command: >
    openssl req -x509 -new -nodes
    -key {{ playbook_dir }}/tls_ca/ca.key
    -sha256 -days 3650
    -out {{ playbook_dir }}/tls_ca/ca.crt
    -subj "/CN=pg-ha-internal-ca"
  args:
    creates: "{{ playbook_dir }}/tls_ca/ca.crt"
  delegate_to: localhost
  run_once: true

- name: Generate per-node private key (control machine only, one per host)
  ansible.builtin.command: openssl genrsa -out {{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.key 2048
  args:
    creates: "{{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.key"
  delegate_to: localhost

- name: Generate a certificate signing request (CSR) for this node
  ansible.builtin.command: >
    openssl req -new
    -key {{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.key
    -out {{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.csr
    -subj "/CN={{ inventory_hostname }}"
  args:
    creates: "{{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.csr"
  delegate_to: localhost

- name: Write the SAN (Subject Alternative Name) config for this node
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.ext"
    content: |
      subjectAltName = DNS:{{ inventory_hostname }}, IP:{{ hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address'] }}
    mode: "0644"
  delegate_to: localhost

- name: Sign the node's CSR with our CA, producing its actual certificate
  ansible.builtin.command: >
    openssl x509 -req
    -in {{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.csr
    -CA {{ playbook_dir }}/tls_ca/ca.crt
    -CAkey {{ playbook_dir }}/tls_ca/ca.key
    -CAcreateserial
    -out {{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.crt
    -days 90
    -sha256
    -extfile {{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.ext
  args:
    creates: "{{ playbook_dir }}/tls_ca/{{ inventory_hostname }}.crt"
  delegate_to: localhost
