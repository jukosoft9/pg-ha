---
- name: Stop and disable the hand-managed PostgreSQL service
  systemd:
    name: pg18
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the old systemd unit (Patroni will use its own)
  file:
    path: /etc/systemd/system/pg18.service
    state: absent

- name: Wipe existing PGDATA (rebuilding fresh under Patroni, not adopting)
  file:
    path: "{{ pgdata_dir }}"
    state: absent

- name: Wipe existing WAL directory
  file:
    path: "{{ pgwal_dir }}"
    state: absent

- name: Recreate empty pgdata/pgwal parent structure for Patroni to bootstrap into
  file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - "{{ pgdata_mount }}"
    - "{{ pgwal_mount }}"