---
- name: Decommission hand-managed PostgreSQL, prepare for Patroni bootstrap (one-time migration only — never runs on a normal playbook run)
  ansible.builtin.import_tasks: decommission.yml
  tags: [never, decommission]

- name: Install Patroni
  ansible.builtin.import_tasks: install.yml

- name: Allow Patroni REST API traffic through the host firewall
  ansible.builtin.import_tasks: firewall.yml

- name: Configure and start Patroni
  ansible.builtin.import_tasks: configure.yml
