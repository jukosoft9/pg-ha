---
- name: Create /etc/patroni config directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Deploy patroni.yml (contains real passwords — never log this)
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  notify: restart patroni

- name: Deploy Patroni systemd unit
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify: reload systemd and restart patroni

- name: Enable and start Patroni
  ansible.builtin.systemd:
    name: patroni
    daemon_reload: true
    enabled: true
    state: started
