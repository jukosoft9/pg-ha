---
- name: Allow HAProxy client ports through ufw (VPC-internal for app traffic; stats port restricted separately)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: 10.0.0.0/16
  loop:
    - "5000"
    - "5001"
    - "7000"

- name: Allow native HAProxy Prometheus metrics from the monitoring host only
  community.general.ufw:
    rule: allow
    port: "8404"
    proto: tcp
    src: "{{ hostvars['mon1']['private_ip'] }}"
