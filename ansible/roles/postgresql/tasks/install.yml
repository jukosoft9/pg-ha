---
- name: Add PGDG apt repository signing key
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PGDG apt repository (official PostgreSQL packages — Ubuntu's own repos only ship one PG version, often not the latest)
  ansible.builtin.apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL 18
  ansible.builtin.apt:
    name:
      - postgresql-18
      - postgresql-contrib-18
    state: present
    update_cache: true

- name: Stop and mask the auto-started default cluster (PGDG's package starts one immediately on /var/lib/postgresql — we run our own on the dedicated volume; masked (not just disabled) because something — likely unattended-upgrades re-running the package's own maintainer script — silently re-enabled this on all three PG nodes after a later reboot, found via chaos testing)
  ansible.builtin.systemd:
    name: "postgresql@18-main"
    state: stopped
    masked: true
  failed_when: false
