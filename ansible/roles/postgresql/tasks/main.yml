---
- name: Storage — format and mount dedicated volumes
  ansible.builtin.import_tasks: storage.yml

- name: Install PostgreSQL and mask the package's auto-initialized cluster
  ansible.builtin.import_tasks: install.yml

- name: Allow PostgreSQL traffic through the host firewall
  ansible.builtin.import_tasks: firewall.yml

- name: Set ownership of PostgreSQL data/WAL directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - "{{ pgdata_mount }}"
    - "{{ pgwal_mount }}"

- name: Deploy TLS certificates (consumed by Patroni, PgBouncer, and pgBackRest — none of them write these files themselves)
  ansible.builtin.import_tasks: tls.yml
