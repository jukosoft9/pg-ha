---
- name: Write temporary password file for initdb (immediately deleted after use)
  ansible.builtin.copy:
    content: "{{ postgres_superuser_password }}"
    dest: /tmp/pg_pwfile
    owner: postgres
    mode: "0600"
  no_log: true

- name: Initialize the PostgreSQL cluster on the dedicated volume
  ansible.builtin.command: >
    /usr/lib/postgresql/18/bin/initdb
    -D {{ pgdata_dir }}
    --waldir={{ pgwal_dir }}
    -U postgres
    --auth=scram-sha-256
    --pwfile=/tmp/pg_pwfile
  args:
    creates: "{{ pgdata_dir }}/PG_VERSION"
  become: true
  become_user: postgres
  no_log: true

- name: Remove the temporary password file
  ansible.builtin.file:
    path: /tmp/pg_pwfile
    state: absent
